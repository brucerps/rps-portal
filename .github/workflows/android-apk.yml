name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android-apk.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Prepare
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap sync android
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD secrets first"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/rps.jks"
      - name: Build APK
        working-directory: android-app/android
        env:
          RPS_KEYSTORE_FILE: ${{ runner.temp }}/rps.jks
          RPS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/RockPapersScissors.apk"
      - uses: actions/upload-artifact@v4
        with: { name: RockPapersScissors-apk, path: RockPapersScissors.apk }
      - name: Publish as a download
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest RockPapersScissors.apk --title "Rock Papers Scissors app (APK) · build ${{ github.run_number }}" --notes "Install on Android: open this file on the phone and allow installing from this source." --latest
